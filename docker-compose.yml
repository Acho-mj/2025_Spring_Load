version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: spring-load-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spring_load
      MYSQL_USER: spring_user
      MYSQL_PASSWORD: spring_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: 
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - spring-load-network
  
  # DB 부하테스트 서비스
  load-test-db:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: load-test-db
    container_name: spring-load-test-db
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - spring-load-network
    depends_on:
      - mysql

  # Prometheus 모니터링 서비스
  prometheus:
    image: prom/prometheus:latest
    container_name: spring-load-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - spring-load-network
    depends_on:
      - load-test-db

  # Grafana 대시보드 서비스
  grafana:
    image: grafana/grafana:latest
    container_name: spring-load-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - spring-load-network
    depends_on:
      - prometheus

  # Redis 부하테스트 서비스
  load-test-redis:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: load-test-redis
    container_name: spring-load-test-redis
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - spring-load-network
    # depends_on:
    #   - redis  # Redis 서비스 추가 시 활성화

  # MQ 부하테스트 서비스
  load-test-mq:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE_NAME: load-test-mq
    container_name: spring-load-test-mq
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - spring-load-network
    # depends_on:
    #   - rabbitmq  # RabbitMQ 서비스 추가 시 활성화

volumes:
  mysql_data:
  prometheus_data:
  grafana_data:

networks:
  spring-load-network:
    driver: bridge