spring:
  config:
    activate:
      on-profile: test
  
  jpa:
    hibernate:
      ddl-auto: create-drop  # 테스트마다 스키마 초기화
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect  # MySQL 사용
        format_sql: true

  sql:
    init:
      mode: never 
      
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.test: DEBUG